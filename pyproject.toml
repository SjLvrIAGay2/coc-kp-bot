[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cockp"
version = "0.1.0"
description = "事件与确定性规则驱动的 COC7 QQ 守秘人"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10", "httpx>=0.27", "pypdf>=5", "pypdfium2>=4.30", "pdfplumber>=0.11", "python-dotenv>=1", "Pillow>=10.4", "cryptography>=44", "openpyxl>=3.1.5,<4", "xlrd>=2.0.2,<3", "defusedxml>=0.7.1,<1"]

[project.scripts]
cockp = "cockp.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cockp*"]
namespaces = false

[tool.setuptools.package-data]
cockp = ["documents/templates/*.xlsx", "documents/skills/*.md", "runtime/persistence/sql/*.sql", "tools/demo_data/*.json", "tools/demo_data/characters/*.json"]
